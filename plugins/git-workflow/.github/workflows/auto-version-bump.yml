name: Auto Version Bump

# Runs AFTER merge to */main — auto-bumps patch if developer forgot
# Works with GITHUB_TOKEN (bot commits don't re-trigger workflows → no loops)

on:
  push:
    branches:
      - '*/main'

jobs:
  auto-bump:
    runs-on: ubuntu-latest

    # Skip if this push was already an auto-bump (safe: expression context, not shell)
    if: "!contains(github.event.head_commit.message, 'chore: auto-bump CalVer')"

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch version check script from main
        run: |
          git fetch origin main
          git show origin/main:scripts/lib/version-check.sh > /tmp/version-check.sh
          chmod +x /tmp/version-check.sh

      - name: Check if version bump needed
        id: check
        run: |
          # Compare merge result with pre-merge state (first parent)
          if /tmp/version-check.sh HEAD~1 HEAD; then
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump CalVer version
        if: steps.check.outputs.needs_bump == 'true'
        run: |
          PLUGIN_JSON=".claude-plugin/plugin.json"

          if [[ ! -f "$PLUGIN_JSON" ]]; then
            echo "No plugin.json found — skipping"
            exit 0
          fi

          CURRENT=$(grep '"version"' "$PLUGIN_JSON" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)

          if [[ -z "$CURRENT" ]]; then
            echo "No valid version found — skipping"
            exit 0
          fi

          # CalVer auto-bump: YYYY.MM.DD (UTC on GitHub runners)
          TODAY=$(date -u +%Y.%m.%d)
          if [[ "$CURRENT" == "$TODAY" ]]; then
            NEW="${TODAY}.1"
          elif [[ "$CURRENT" == "${TODAY}."* ]]; then
            MICRO="${CURRENT##*.}"
            NEW="${TODAY}.$((MICRO + 1))"
          else
            NEW="$TODAY"
          fi

          # Use sed (GNU sed on ubuntu)
          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEW\"/" "$PLUGIN_JSON"

          echo "Auto-bumped: $CURRENT -> $NEW"

      - name: Commit and push
        if: steps.check.outputs.needs_bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git commit -m "chore: auto-bump CalVer"
          git push
