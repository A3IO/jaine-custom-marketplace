[project]
name = "jaine-gemini-media-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27,<1",
]

# Dev-only test tooling. NOT installed at runtime: the MCP server launches via
# `uv run --frozen --offline` with UV_NO_SYNC=1, which installs only the default
# dependency group. These land in uv.lock but never in the runtime venv.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-n auto"
pythonpath = ["."]
testpaths = ["tests"]
